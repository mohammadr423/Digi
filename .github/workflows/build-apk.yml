name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        id: proj
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk digikala-cheap-v1.0.${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: digikala-cheap-apk
          path: ${{ steps.proj.outputs.dir }}/digikala-cheap-v1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Digikala Cheap Collector v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: ${{ steps.proj.outputs.dir }}/digikala-cheap-v1.0.${{ github.run_number }}.apk
